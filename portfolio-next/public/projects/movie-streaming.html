<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Streaming Platform Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        header {
            background: #141414;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: #e50914;
            letter-spacing: 2px;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: white;
        }

        .hero-banner {
            height: 420px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.9) 40%, transparent 100%),
                linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            align-items: center;
            padding: 3rem;
        }

        .hero-info {
            max-width: 500px;
        }

        .hero-info .badge {
            background: #e50914;
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 0.3rem;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .hero-info h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }

        .hero-info p {
            color: #ccc;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .hero-btns {
            display: flex;
            gap: 1rem;
        }

        .play-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .play-btn:hover {
            background: #b20710;
        }

        .info-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .info-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .search-row {
            padding: 1.5rem 2rem 0.5rem;
            display: flex;
            gap: 1rem;
            max-width: 500px;
        }

        .search-row input {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 0.7rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }

        .search-row input:focus {
            border-color: #e50914;
        }

        .section-title {
            padding: 1rem 2rem 0.5rem;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .movies-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            padding: 0.5rem 2rem 2rem;
        }

        .movie-card {
            background: #1a1a1a;
            border-radius: 0.75rem;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card:hover .overlay {
            opacity: 1;
        }

        .movie-thumb {
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }

        .play-circle {
            width: 56px;
            height: 56px;
            background: #e50914;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .movie-info {
            padding: 0.75rem;
        }

        .movie-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #aaa;
        }

        .rating {
            color: #feca57;
            font-weight: 700;
        }

        .genre-tag {
            background: #e5091422;
            color: #e50914;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            background: #1a1a1a;
            border-radius: 1.5rem;
            max-width: 600px;
            width: 90%;
            overflow: hidden;
        }

        .modal-thumb {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7rem;
        }

        .modal-body {
            padding: 1.75rem;
        }

        .modal-body h2 {
            margin-bottom: 0.5rem;
        }

        .modal-body p {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 1.25rem;
        }

        .modal-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }

        .modal-btns {
            display: flex;
            gap: 1rem;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #333;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">STREAMIX</div>
        <a href="../index.html" class="back-link">← Portfolio</a>
    </header>
    <div class="hero-banner">
        <div class="hero-info">
            <span class="badge">🔥 Trending #1</span>
            <h1>The Code Master</h1>
            <p>A brilliant software engineer uncovers a global conspiracy hidden inside a neural network — and must race
                against time to stop it.</p>
            <div class="hero-btns">
                <button class="play-btn" onclick="alert('▶ Playing The Code Master...\n\n(This is a demo project!)')">▶
                    Play</button>
                <button class="info-btn">ℹ More Info</button>
            </div>
        </div>
    </div>

    <div class="search-row">
        <input type="text" placeholder="🔍 Search movies..." id="searchInput" oninput="renderMovies()">
    </div>

    <div class="section-title" id="sectionTitle">🎬 Popular Movies</div>
    <div class="movies-row" id="moviesGrid"></div>

    <div class="modal" id="modal">
        <div class="modal-card" style="position:relative">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-thumb" id="modalThumb"></div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <div class="modal-meta">
                    <span class="rating" id="modalRating"></span>
                    <span id="modalYear"></span>
                    <span id="modalDuration"></span>
                </div>
                <p id="modalDesc"></p>
                <div class="modal-btns">
                    <button class="play-btn" onclick="alert('▶ Playing...\n\n(Demo only)')">▶ Play</button>
                    <button class="info-btn" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const movies = [
            { id: 1, title: 'Inception Dreams', emoji: '🌀', genre: 'Sci-Fi', year: 2023, rating: 9.2, duration: '2h 28m', desc: 'A thief uses dream-sharing technology to steal secrets — but questions reality at every level.' },
            { id: 2, title: 'Code Runners', emoji: '💻', genre: 'Thriller', year: 2024, rating: 8.7, duration: '1h 54m', desc: 'Elite hackers must break into the world\'s most secure system to save mankind.' },
            { id: 3, title: 'The Last Lion', emoji: '🦁', genre: 'Drama', year: 2023, rating: 8.0, duration: '2h 10m', desc: 'A lion orphaned in the Serengeti must survive alone and lead a pride through adversity.' },
            { id: 4, title: 'Galaxy Quest', emoji: '🚀', genre: 'Sci-Fi', year: 2022, rating: 8.5, duration: '2h 05m', desc: 'A crew of space explorers discovers an ancient alien civilization on the edge of the universe.' },
            { id: 5, title: 'Laugh Out Loud', emoji: '😂', genre: 'Comedy', year: 2024, rating: 7.8, duration: '1h 42m', desc: 'A stand-up comedian accidentally becomes a viral sensation and must navigate sudden fame.' },
            { id: 6, title: 'Dark Waters', emoji: '🌊', genre: 'Horror', year: 2023, rating: 7.5, duration: '1h 58m', desc: 'A deep-sea dive goes terribly wrong when the crew discovers something dormant in the deep.' },
            { id: 7, title: 'The Great Heist', emoji: '💰', genre: 'Action', year: 2022, rating: 9.0, duration: '2h 15m', desc: 'Five masterminds plan the most elaborate bank robbery the world has ever seen.' },
            { id: 8, title: 'Eternal Bloom', emoji: '🌸', genre: 'Romance', year: 2024, rating: 8.1, duration: '1h 50m', desc: 'Two strangers meet by chance in a mountain village and fall in love across the seasons.' },
        ];

        function renderMovies() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q));
            document.getElementById('sectionTitle').textContent = q ? `🔍 Results for "${document.getElementById('searchInput').value}"` : '🎬 Popular Movies';
            document.getElementById('moviesGrid').innerHTML = filtered.map(m => `
        <div class="movie-card" onclick="openModal(${m.id})">
            <div class="movie-thumb" style="background:linear-gradient(135deg,#1a1a2e,#16213e)">${m.emoji}</div>
            <div class="overlay"><div class="play-circle">▶</div></div>
            <div class="movie-info">
                <div class="movie-title">${m.title}</div>
                <div class="movie-meta">
                    <span class="rating">⭐ ${m.rating}</span>
                    <span>${m.year}</span>
                    <span class="genre-tag">${m.genre}</span>
                </div>
            </div>
        </div>
    `).join('') || '<p style="padding:2rem;color:#666;grid-column:1/-1">No movies found.</p>';
        }

        function openModal(id) {
            const m = movies.find(mo => mo.id === id);
            document.getElementById('modalThumb').innerHTML = `<span style="font-size:7rem">${m.emoji}</span>`;
            document.getElementById('modalThumb').style.background = 'linear-gradient(135deg,#1a1a2e,#16213e)';
            document.getElementById('modalTitle').textContent = m.title;
            document.getElementById('modalRating').textContent = '⭐ ' + m.rating;
            document.getElementById('modalYear').textContent = m.year;
            document.getElementById('modalDuration').textContent = '🕐 ' + m.duration;
            document.getElementById('modalDesc').textContent = m.desc;
            document.getElementById('modal').classList.add('show');
        }
        function closeModal() { document.getElementById('modal').classList.remove('show'); }
        document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
        renderMovies();
    </script>
</body>

</html>
