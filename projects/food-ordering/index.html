<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Express - Premium Food Delivery</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF6B00; --s: #FFB800; --bg: #FDFCFB; --dark: #1A1A1A; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--dark); }
        
        .nav { background: white; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F1EFEF; position: sticky; top:0; z-index:100; }
        .main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        /* CATEGORIES */
        .cat-bar { display: flex; gap: 1rem; overflow-x: auto; padding: 1rem 0; margin-bottom: 2rem; scrollbar-width: none; }
        .cat-card { background: white; padding: 0.8rem 1.5rem; border-radius: 50px; border: 1px solid #ECECEC; cursor: pointer; white-space: nowrap; font-weight: 700; transition: 0.3s; }
        .cat-card.active { background: var(--p); color: white; border-color: var(--p); box-shadow: 0 8px 15px rgba(255, 107, 0, 0.2); }

        /* MENU GRID */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .food-card { background: white; border-radius: 24px; border: 1px solid #F1EFEF; overflow: hidden; transition: 0.3s; }
        .food-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .food-img { width: 100%; height: 200px; object-fit: cover; }
        .food-info { padding: 1.5rem; }
        
        /* CART DRAWER */
        .cart-drawer { position: fixed; right: -400px; top: 0; width: 400px; height: 100vh; background: white; box-shadow: -10px 0 50px rgba(0,0,0,0.1); z-index: 200; padding: 2.5rem; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-drawer.open { right: 0; }
        
        /* DASHBOARD */
        .btn { padding: 0.8rem 1.4rem; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .btn-p { background: var(--p); color: white; }
        
        #auth { position: fixed; inset:0; background: var(--dark); display:flex; align-items:center; justify-content:center; z-index: 1000; }
        .login { background: white; padding: 3.5rem; border-radius: 30px; width: 420px; text-align: center; }
        .field { width:100%; padding:1rem; border:2px solid #F1EFEF; border-radius:14px; margin-bottom:1rem; outline:none; }
        .hidden { display: none !important; }
        
        .badge { padding: 0.4rem 0.8rem; border-radius: 30px; font-size: 0.75rem; font-weight: 800; }
        .status-pill { background: #FFF4EB; color: var(--p); }
    </style>
</head>
<body>

    <div id="auth">
        <div class="login">
            <h1 style="color:var(--p); font-weight:900; letter-spacing:-2px; margin-bottom:0.5rem">GourmetExpress</h1>
            <p id="auth-sub" style="margin-bottom:2.5rem; color:#888">Discover the best flavors in town.</p>
            <input type="text" id="u" class="field" placeholder="Username" value="customer">
            <input type="password" id="p" class="field" placeholder="Password" value="password">
            <button id="auth-btn" class="btn btn-p" style="width:100%" onclick="handleAuth()">Sign In</button>
            <div style="margin-top:1.5rem; font-size:0.85rem">
                <span id="auth-text" style="color:#888">New to Gourmet?</span>
                <a href="#" id="auth-link" style="color:var(--p); font-weight:700; text-decoration:none" onclick="toggleAuth()">Join Now</a>
            </div>
        </div>
    </div>

    <div id="app" class="hidden">
        <nav class="nav">
            <h2 style="font-weight:900; letter-spacing:-1px">Gourmet<span style="color:var(--p)">Express</span></h2>
            <div style="display:flex; gap:1.5rem; align-items:center">
                <span id="u-bal" style="font-weight:800; background:#FFF4EB; color:var(--p); padding:0.5rem 1rem; border-radius:12px">$0.00</span>
                <button class="btn" style="background:#F7F7F7" onclick="v('orders')">📦 My Orders</button>
                <button class="btn" style="background:var(--dark); color:white" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
                <button class="btn" id="adm-lnk" style="background:var(--s); color:white" onclick="v('admin')">🛡 Admin</button>
                <button class="btn" style="background:none" onclick="location.reload()">Logout</button>
            </div>
        </nav>

        <main class="main">
            <!-- SHOP VIEW -->
            <div id="v-shop" class="v">
                <div class="cat-bar">
                    <div class="cat-card active" onclick="filterMenu('All')">All Flavors</div>
                    <div class="cat-card" onclick="filterMenu('Pizza')">🍕 Pizza</div>
                    <div class="cat-card" onclick="filterMenu('Burgers')">🍔 Burgers</div>
                    <div class="cat-card" onclick="filterMenu('Pasta')">🍝 Pasta</div>
                    <div class="cat-card" onclick="filterMenu('Drinks')">🥤 Drinks</div>
                </div>
                <div class="menu-grid" id="menu-grid"></div>
            </div>

            <!-- ORDERS VIEW -->
            <div id="v-orders" class="v hidden">
                <h3 style="margin-bottom:2rem">Order History</h3>
                <div id="orders-list"></div>
            </div>

            <!-- ADMIN VIEW -->
            <div id="v-admin" class="v hidden">
                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1.5rem; margin-bottom:2rem">
                    <div class="food-card" style="padding:1.5rem"><b>Total Revenue</b><h2 id="a-rev">$0</h2></div>
                    <div class="food-card" style="padding:1.5rem"><b>Orders Today</b><h2 id="a-cnt">0</h2></div>
                </div>
                <div id="a-orders"></div>
            </div>
        </main>

        <!-- CART -->
        <div id="cart" class="cart-drawer">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem">
                <h2 style="font-weight:900">Your Basket</h2>
                <button onclick="toggleCart()" style="background:none; border:none; cursor:pointer; font-size:1.5rem">✕</button>
            </div>
            <div id="cart-items" style="flex:1; overflow-y:auto; margin-bottom:2rem"></div>
            <div style="border-top:2px dashed #EEE; padding-top:2rem">
                <div style="display:flex; justify-content:space-between; margin-bottom:1rem"><span>Subtotal</span><b id="cart-sub">$0.00</b></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:2rem; font-size:1.2rem"><span style="font-weight:800">Total</span><b id="cart-total" style="color:var(--p)">$0.00</b></div>
                <button class="btn btn-p" style="width:100%; padding:1.2rem" onclick="checkout()">Checkout Now</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3004/api';
        let user = null, menu = [], cart = [], isRegister = false;

        function toggleAuth() {
            isRegister = !isRegister;
            document.getElementById('auth-sub').innerText = isRegister ? 'Create your gourmet account today.' : 'Discover the best flavors in town.';
            document.getElementById('auth-btn').innerText = isRegister ? 'Join Now' : 'Sign In';
            document.getElementById('auth-text').innerText = isRegister ? 'Already a member?' : 'New to Gourmet?';
            document.getElementById('auth-link').innerText = isRegister ? 'Sign In' : 'Join Now';
        }

        async function handleAuth() {
            if (isRegister) register();
            else login();
        }

        async function register() {
            const username = document.getElementById('u').value;
            const password = document.getElementById('p').value;
            const res = await fetch(`${API}/auth/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, password}) });
            if (res.ok) {
                alert('Welcome to Gourmet Express! You can now sign in.');
                toggleAuth();
            } else alert('Username already taken');
        }

        async function login() {
            const res = await fetch(`${API}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:document.getElementById('u').value, password:document.getElementById('p').value}) });
            if (res.ok) {
                user = (await res.json()).user;
                document.getElementById('auth').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                if (user.role !== 'admin') document.getElementById('adm-lnk').classList.add('hidden');
                document.getElementById('u-bal').innerText = `$${user.balance.toFixed(2)}`;
                loadMenu();
            } else alert('Access Denied');
        }

        async function loadMenu() {
            menu = await (await fetch(`${API}/menu`)).json();
            renderMenu(menu);
        }

        function renderMenu(items) {
            document.getElementById('menu-grid').innerHTML = items.map(f => `
                <div class="food-card">
                    <img src="${f.image}" class="food-img">
                    <div class="food-info">
                        <div style="display:flex; justify-content:space-between">
                            <h4 style="font-size:1.1rem">${f.name}</h4>
                            <b style="color:var(--p)">$${f.price}</b>
                        </div>
                        <p style="color:#888; font-size:0.85rem; margin-top:0.5rem">${f.desc}</p>
                        <button class="btn btn-p" style="width:100%; margin-top:1.5rem; background:#FDF3ED; color:var(--p)" onclick="addToCart(${f.id})">Add to Basket</button>
                    </div>
                </div>
            `).join('');
        }

        function filterMenu(cat) {
            document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(cat === 'All' ? menu : menu.filter(m => m.category === cat));
        }

        function addToCart(id) {
            const i = menu.find(m => m.id === id);
            cart.push(i);
            renderCart();
            if(!document.getElementById('cart').classList.contains('open')) toggleCart();
        }

        function renderCart() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `
                <div style="display:flex; justify-content:space-between; margin-bottom:1.5rem">
                    <div><b>${i.name}</b><br><small>$${i.price}</small></div>
                    <button onclick="cart.splice(${idx},1); renderCart()" style="background:none; border:none; color:#F43F5E; cursor:pointer">Remove</button>
                </div>
            `).join('');
            const sub = cart.reduce((a, b) => a + b.price, 0);
            document.getElementById('cart-sub').innerText = `$${sub.toFixed(2)}`;
            document.getElementById('cart-total').innerText = `$${sub.toFixed(2)}`;
        }

        async function checkout() {
            if (cart.length === 0) return alert('Basket is empty');
            const total = cart.reduce((a, b) => a + b.price, 0);
            const res = await fetch(`${API}/orders`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId: user.id, items: cart, total}) });
            if (res.ok) {
                alert('Order Placed Successfully! Cooking starts now.');
                cart = []; renderCart(); toggleCart(); v('orders');
                const uData = await res.json();
                document.getElementById('u-bal').innerText = `$${(user.balance - total).toFixed(2)}`;
            } else alert('Insufficient balance in Gourmet Wallet');
        }

        async function v(view) {
            document.querySelectorAll('.v').forEach(el => el.classList.add('hidden'));
            document.getElementById(`v-${view}`).classList.remove('hidden');
            if (view === 'orders') loadOrders();
            if (view === 'admin') loadAdmin();
        }

        async function loadOrders() {
            const list = await (await fetch(`${API}/orders/${user.id}`)).json();
            document.getElementById('orders-list').innerHTML = list.map(o => `
                <div class="food-card" style="padding:1.5rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center">
                    <div><b>Order #${o.id}</b><br><small>${o.items.length} items • ${new Date(o.orderedAt).toLocaleString()}</small></div>
                    <div style="text-align:right">
                        <span class="badge status-pill">${o.status.toUpperCase()}</span><br>
                        <b>$${o.total.toFixed(2)}</b>
                    </div>
                </div>
            `).join('');
        }

        async function loadAdmin() {
            const stats = await (await fetch(`${API}/admin/stats`)).json();
            document.getElementById('a-rev').innerText = `$${stats.revenue.toFixed(2)}`;
            document.getElementById('a-cnt').innerText = stats.totalOrders;
            const orders = await (await fetch(`${API}/admin/orders`)).json();
            document.getElementById('a-orders').innerHTML = orders.map(o => `
                <div class="food-card" style="padding:1.5rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center">
                    <div><b>Order #${o.id}</b><br><small>$${o.total.toFixed(2)}</small></div>
                    <select onchange="updateStat(${o.id}, this.value)" style="padding:0.4rem; border-radius:8px">
                        <option ${o.status==='pending'?'selected':''}>pending</option>
                        <option ${o.status==='cooking'?'selected':''}>cooking</option>
                        <option ${o.status==='delivering'?'selected':''}>delivering</option>
                        <option ${o.status==='completed'?'selected':''}>completed</option>
                    </select>
                </div>
            `).join('');
        }

        async function updateStat(id, status) {
            await fetch(`${API}/admin/orders/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status}) });
        }

        function toggleCart() { document.getElementById('cart').classList.toggle('open'); }
    </script>
</body>
</html>
