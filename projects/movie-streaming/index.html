<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaElite - Stream Beyond limits</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #E50914; --bg: #0B0B0B; --card: #1C1C1C; --text: #FFFFFF; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        .nav { background: rgba(11,11,11,0.95); backdrop-filter: blur(10px); padding: 1.25rem 4rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .main { padding: 2rem 4rem; }
        
        /* HERO */
        .hero { height: 70vh; width: 100%; border-radius: 30px; background: linear-gradient(to top, var(--bg), transparent), url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&q=80&w=1200') center/cover; display: flex; align-items: flex-end; padding: 4rem; margin-bottom: 3rem; }
        .hero-content { max-width: 600px; }
        
        /* MOVIE GRID */
        .category { margin-bottom: 4rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .m-card { position: relative; border-radius: 20px; overflow: hidden; height: 400px; cursor: pointer; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .m-card:hover { transform: scale(1.05); z-index: 10; border: 2px solid var(--p); }
        .m-img { width: 100%; height: 100%; object-fit: cover; }
        .m-overlay { position: absolute; inset:0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 1.5rem; opacity: 0; transition: 0.3s; }
        .m-card:hover .m-overlay { opacity: 1; }
        
        /* PLAYER MODAL */
        #player { position: fixed; inset:0; background: black; display: none; flex-direction: column; z-index: 3000; }
        .player-header { padding: 2rem 4rem; display: flex; justify-content: space-between; align-items: center; }
        video { width: 100%; height: 70vh; outline: none; }

        .btn { padding: 0.8rem 1.6rem; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .btn-p { background: var(--p); color: white; }
        .btn-s { background: white; color: black; }
        
        #auth { position: fixed; inset:0; background: var(--bg); display:flex; align-items:center; justify-content:center; z-index: 4000; }
        .login { background: var(--card); padding: 3.5rem; border-radius: 30px; width: 440px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .field { width:100%; padding:1rem; background: #2A2A2A; border:none; border-radius:14px; margin-bottom:1rem; color:white; font-family:inherit; }
        .hidden { display: none !important; }
        
        .badge { background: var(--p); padding: 0.2rem 0.6rem; border-radius: 5px; font-size: 0.75rem; font-weight: 800; float: right; }
    </style>
</head>
<body>

    <div id="auth">
        <div class="login">
            <h1 style="color:var(--p); font-weight:900; letter-spacing:-2px; font-size:2.5rem; margin-bottom:1rem">CinemaElite</h1>
            <p style="color:#888; margin-bottom:2.5rem">Unrivaled streaming experience.</p>
            <input type="text" id="u" class="field" placeholder="Username" value="watcher">
            <input type="password" id="p" class="field" placeholder="Password" value="password">
            <button id="auth-btn" class="btn btn-p" style="width:100%; font-size:1rem" onclick="handleAuth()">Start Watching</button>
            <p style="margin-top:1.5rem; color:#888; font-size:0.9rem">New member? <a href="#" style="color:var(--p); font-weight:800; text-decoration:none" onclick="toggleAuth()">Join Now</a></p>
        </div>
    </div>

    <div id="app" class="hidden">
        <nav class="nav">
            <h2 style="font-weight:900; letter-spacing:-2px; font-size:1.8rem"><span style="color:var(--p)">Cinema</span>Elite</h2>
            <div style="display:flex; gap:2.5rem; align-items:center">
                <a href="#" style="color:white; text-decoration:none; font-weight:700" onclick="v('home')">Home</a>
                <a href="#" style="color:#888; text-decoration:none; font-weight:700" onclick="v('watchlist')">My List</a>
                <button class="btn btn-s" onclick="location.reload()">Sign Out</button>
            </div>
        </nav>

        <div class="hero">
            <div class="hero-content">
                <span class="badge" style="float:none; margin-bottom:10px; display:inline-block">FEATURED</span>
                <h1 style="font-size:3.5rem; font-weight:900; line-height:1; margin-bottom:1.5rem">The Stellar Horizon</h1>
                <p style="font-size:1.1rem; color:#E1E1E1; margin-bottom:2rem">Witness the untold legends of the far reaches of our galaxy in this visual masterpiece.</p>
                <div style="display:flex; gap:1rem">
                    <button class="btn btn-s" onclick="watch(1)">▶ Play Now</button>
                    <button class="btn" style="background:rgba(255,255,255,0.1); color:white" onclick="toggleW(1)">+ Add List</button>
                </div>
            </div>
        </div>

        <main class="main">
            <div id="v-home" class="v">
                <div class="category">
                    <h3 style="font-size:1.5rem">Trending Library</h3>
                    <div class="grid" id="m-grid"></div>
                </div>
            </div>

            <div id="v-watchlist" class="v hidden">
                <h2 style="font-size:2rem; margin-bottom:2rem">My Personalized Watchlist</h2>
                <div class="grid" id="w-grid"></div>
            </div>
        </main>
    </div>

    <div id="player">
        <div class="player-header">
            <button class="btn" style="background:none; color:white; font-size:1.5rem; cursor:pointer" onclick="closePlayer()">〈 Back</button>
            <h2 id="p-title">Interstellar</h2>
            <div></div>
        </div>
        <video id="p-vid" controls autoplay></video>
        <div style="padding:4rem; max-width:800px">
            <h3 style="color:var(--p); margin-bottom:1rem">SYNOPSIS</h3>
            <p id="p-desc" style="color:#CCC; line-height:1.6"></p>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3006/api';
        let user = null, movies = [];

        async function handleAuth() {
            const u = document.getElementById('u').value, p = document.getElementById('p').value;
            const res = await fetch(`${API}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p}) });
            if (res.ok) {
                user = (await res.json()).user;
                document.getElementById('auth').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                loadData();
            } else alert('Access Denied');
        }

        async function loadData() {
            movies = await (await fetch(`${API}/movies`)).json();
            renderMovies();
        }

        function renderMovies() {
            document.getElementById('m-grid').innerHTML = movies.map(m => `
                <div class="m-card" onclick="watch(${m.id})">
                    <img src="${m.image}" class="m-img">
                    <div class="m-overlay">
                        <span class="badge" style="background:var(--secondary)">⭐ ${m.rating}</span>
                        <h3>${m.title}</h3>
                        <p style="font-size:0.8rem; color:#CCC; margin-top:5px">${m.genre}</p>
                        <button class="btn btn-p" style="margin-top:1.5rem; padding:0.5rem" onclick="event.stopPropagation(); toggleW(${m.id})">${user.watchlist.includes(m.id)?'✓ Listed':'+ Watchlist'}</button>
                    </div>
                </div>
            `).join('');
        }

        async function toggleW(id) {
            const res = await fetch(`${API}/watchlist`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId: user.id, movieId: id}) });
            if (res.ok) {
                user.watchlist = (await res.json()).watchlist;
                renderMovies();
                if(!document.getElementById('v-watchlist').classList.contains('hidden')) v('watchlist');
            }
        }

        function v(view) {
            document.querySelectorAll('.v').forEach(el => el.classList.add('hidden'));
            document.getElementById(`v-${view}`).classList.remove('hidden');
            if (view === 'watchlist') {
                const list = movies.filter(m => user.watchlist.includes(m.id));
                document.getElementById('w-grid').innerHTML = list.map(m => `
                    <div class="m-card" onclick="watch(${m.id})">
                        <img src="${m.image}" class="m-img">
                        <div class="m-overlay"><h3>${m.title}</h3></div>
                    </div>
                `).join('') || '<p style="color:#666">Your list is currently empty.</p>';
            }
        }

        function watch(id) {
            const m = movies.find(x => x.id === id);
            document.getElementById('p-title').innerText = m.title;
            document.getElementById('p-desc').innerText = m.desc;
            document.getElementById('p-vid').src = m.video;
            document.getElementById('player').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            document.getElementById('p-vid').pause();
            document.getElementById('player').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
